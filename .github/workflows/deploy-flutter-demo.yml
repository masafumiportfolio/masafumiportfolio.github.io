name: Deploy Flutter Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'workout_tracker/**'
      - '.github/workflows/deploy-flutter-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: workout_tracker
        run: flutter pub get

      - name: Build Flutter Web (Demo)
        working-directory: workout_tracker
        run: |
          flutter build web \
            --target lib/main_demo.dart \
            --base-href /workout_tracker/ \
            --release

      - name: Prepare pages artifact
        run: |
          mkdir -p _site/workout_tracker
          cp -r index.html style.css img _site/
          cp -r workout_tracker/build/web/* _site/workout_tracker/
          ls -la _site/workout_tracker/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
