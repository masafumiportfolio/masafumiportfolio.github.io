name: workout_tracker
description: 筋トレ記録アプリ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  flutter_riverpod: ^2.4.9

  # UI
  fl_chart: ^0.66.0          # グラフ
  table_calendar: ^3.0.9     # カレンダー
  intl: ^0.19.0              # 日付フォーマット
  google_fonts: ^6.1.0       # フォント

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
