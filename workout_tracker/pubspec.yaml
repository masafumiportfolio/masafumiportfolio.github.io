name: workout_tracker
description: 筋トレ記録アプリ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  # 状態管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # ローカルDB
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.8.3

  # UI
  fl_chart: ^0.66.0          # グラフ
  table_calendar: ^3.0.9     # カレンダー
  intl: ^0.19.0              # 日付フォーマット
  google_fonts: ^6.1.0       # フォント

  # ユーティリティ
  uuid: ^4.3.3
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
