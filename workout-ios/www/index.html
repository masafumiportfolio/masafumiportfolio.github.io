<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="筋トレ記録">
  <meta name="format-detection" content="telephone=no">
  <title>筋トレ記録</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1E88E5;
      --primary-light: #42A5F5;
      --bg: #121212;
      --surface: #1E1E1E;
      --surface2: #2A2A2A;
      --surface3: #333;
      --on-surface: #E0E0E0;
      --on-surface-dim: #9E9E9E;
      --red: #EF5350;
      --radius: 12px;
      --nav-h: calc(64px + env(safe-area-inset-bottom));
      --safe-top: env(safe-area-inset-top);
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--on-surface);
      min-height: 100vh;
      max-width: 600px;
      margin: 0 auto;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      overflow-x: hidden;
    }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      height: var(--nav-h);
      background: var(--surface);
      display: flex;
      border-top: 1px solid var(--surface3);
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      color: var(--on-surface-dim);
      font-size: 11px;
      font-weight: 500;
      user-select: none;
      transition: color 0.2s;
      padding-bottom: 4px;
    }
    .nav-item.active { color: var(--primary); }
    .nav-item svg { width: 24px; height: 24px; }

    /* ===== PAGES ===== */
    .page { display: none; padding-bottom: calc(var(--nav-h) + 16px); min-height: 100vh; }
    .page.active { display: block; }

    .app-bar {
      padding: calc(var(--safe-top) + 16px) 16px 12px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 50;
    }
    .app-bar h1 { font-size: 26px; font-weight: 700; }

    /* ===== CARDS ===== */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      margin: 0 16px 12px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--on-surface-dim);
      margin-bottom: 12px;
    }

    /* ===== STATS ===== */
    .stats-row { display: flex; justify-content: space-around; }
    .stat-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .stat-value { font-size: 34px; font-weight: 700; color: var(--primary); }
    .stat-label { font-size: 11px; color: var(--on-surface-dim); }

    /* ===== CALENDAR ===== */
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cal-header h3 { font-size: 15px; font-weight: 600; }
    .cal-nav {
      background: none;
      border: none;
      color: var(--on-surface);
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 20px;
      line-height: 1;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cal-nav:active { background: var(--surface2); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-weekday { text-align: center; font-size: 11px; color: var(--on-surface-dim); padding: 4px 0 6px; }
    .cal-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
      position: relative;
      transition: background 0.1s;
      min-height: 36px;
    }
    .cal-day:active:not(.empty) { background: var(--surface2); }
    .cal-day.empty { cursor: default; pointer-events: none; }
    .cal-day.today { background: rgba(30,136,229,0.25); color: var(--primary-light); font-weight: 700; }
    .cal-day.selected { background: var(--primary) !important; color: white !important; font-weight: 700; }
    .cal-day.has-workout::after {
      content: '';
      position: absolute;
      bottom: 3px;
      width: 5px;
      height: 5px;
      background: var(--primary-light);
      border-radius: 50%;
    }
    .cal-day.selected::after { background: rgba(255,255,255,0.7); }

    /* ===== SECTION HEADER ===== */
    .section-header { font-size: 15px; font-weight: 600; margin: 4px 16px 8px; }

    /* ===== SESSION CARDS ===== */
    .session-card {
      background: var(--surface);
      border-radius: var(--radius);
      margin: 0 16px 10px;
      overflow: hidden;
    }
    .session-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      min-height: 44px;
    }
    .session-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }
    .session-info { flex: 1; min-width: 0; }
    .session-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-meta { font-size: 12px; color: var(--on-surface-dim); margin-top: 3px; }
    .session-body { display: none; padding: 0 16px 14px; }
    .session-body.open { display: block; }
    .ex-row { margin-bottom: 10px; }
    .ex-name { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .set-text { font-size: 12px; color: var(--on-surface-dim); padding: 1px 8px; }
    .delete-btn {
      background: none;
      border: none;
      color: var(--on-surface-dim);
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      font-size: 17px;
      flex-shrink: 0;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .delete-btn:active { color: var(--red); }

    /* ===== FAB ===== */
    .fab {
      position: fixed;
      bottom: calc(var(--nav-h) + 16px);
      right: max(16px, calc(50% - 284px));
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 28px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(30,136,229,0.45);
      z-index: 90;
      transition: transform 0.1s;
      -webkit-touch-callout: none;
    }
    .fab:active { transform: scale(0.97); }
    .fab svg { width: 20px; height: 20px; }

    /* ===== FULL SCREEN MODAL ===== */
    .screen {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      height: 100%;
      background: var(--bg);
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    .screen.open { display: flex; }
    .screen-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--surface3);
      flex-shrink: 0;
    }
    .screen-header h2 { font-size: 17px; font-weight: 600; flex: 1; min-width: 0; }
    .back-btn {
      background: none;
      border: none;
      color: var(--on-surface);
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .screen-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; }

    /* ===== WORKOUT FORM ===== */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; color: var(--on-surface-dim); margin-bottom: 5px; }
    input[type="text"], input[type="number"] {
      background: var(--surface2);
      border: 1.5px solid transparent;
      border-radius: 10px;
      color: var(--on-surface);
      font-family: inherit;
      font-size: 16px; /* 16px prevents iOS auto-zoom */
      padding: 10px 12px;
      width: 100%;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    input[type="text"]:focus, input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
    }
    input[type="number"] { text-align: center; }
    .duration-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .duration-row input { width: 90px; }
    .duration-row span { font-size: 13px; color: var(--on-surface-dim); }

    .exercise-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .exercise-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .exercise-card-name { font-size: 15px; font-weight: 600; }
    .sets-table-head {
      display: grid;
      grid-template-columns: 28px 1fr 1fr 40px;
      gap: 8px;
      font-size: 11px;
      color: var(--on-surface-dim);
      padding: 0 2px 4px;
      text-align: center;
    }
    .set-row-input {
      display: grid;
      grid-template-columns: 28px 1fr 1fr 40px;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .set-num { text-align: center; font-size: 13px; font-weight: 700; color: var(--primary); }
    .rm-set-btn {
      background: none;
      border: none;
      color: var(--on-surface-dim);
      cursor: pointer;
      font-size: 20px;
      padding: 4px;
      border-radius: 6px;
      line-height: 1;
      min-width: 40px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 20px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      min-height: 44px;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.75; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-outlined { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); }
    .btn-text { background: none; color: var(--primary); padding: 8px 10px; }
    .btn-danger-text { background: none; color: var(--red); padding: 6px 10px; font-size: 13px; }
    .btn-block { width: 100%; }

    /* ===== BOTTOM SHEET ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .overlay.open { display: flex; }
    .sheet {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 600px;
      max-height: 78vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 16px calc(32px + env(safe-area-inset-bottom));
    }
    .sheet-handle { width: 40px; height: 4px; background: var(--surface3); border-radius: 2px; margin: 0 auto 16px; }
    .sheet-title { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
    .sheet-search {
      background: var(--surface2);
      border: 1.5px solid transparent;
      border-radius: 10px;
      color: var(--on-surface);
      font-family: inherit;
      font-size: 16px;
      padding: 10px 14px;
      width: 100%;
      margin-bottom: 12px;
      -webkit-appearance: none;
    }
    .sheet-search:focus { outline: none; border-color: var(--primary); }
    .sheet-category { font-size: 11px; font-weight: 700; color: var(--on-surface-dim); text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 4px 4px; }
    .sheet-option {
      display: flex;
      align-items: center;
      padding: 13px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 1px solid var(--surface3);
      min-height: 44px;
    }
    .sheet-option:active { background: var(--surface2); }

    /* ===== TAB BAR ===== */
    .tab-bar {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--surface3);
      position: sticky;
      top: 0;
      z-index: 50;
      padding-top: var(--safe-top);
    }
    .tab-item {
      flex: 1;
      padding: 14px 8px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      color: var(--on-surface-dim);
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tab-item.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ===== PROGRESS ===== */
    .progress-header { padding: 16px 16px 8px; }
    select {
      background: var(--surface);
      border: 1.5px solid var(--surface3);
      border-radius: 10px;
      color: var(--on-surface);
      font-family: inherit;
      font-size: 16px;
      padding: 10px 14px;
      width: 100%;
      cursor: pointer;
      -webkit-appearance: none;
    }
    select:focus { outline: none; border-color: var(--primary); }
    .progress-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 16px 12px; }
    .progress-stat {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-stat-icon { font-size: 22px; }
    .progress-stat-label { font-size: 11px; color: var(--on-surface-dim); }
    .progress-stat-val { font-size: 16px; font-weight: 700; }
    .chart-wrap { background: var(--surface); border-radius: var(--radius); padding: 16px; margin: 0 16px 12px; }
    .records-list { padding: 0 16px; }
    .record-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--surface3); font-size: 13px; }
    .record-weight { font-weight: 700; }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      text-align: center;
      color: var(--on-surface-dim);
      gap: 12px;
    }
    .empty-state svg { width: 60px; height: 60px; opacity: 0.35; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    /* ===== SNACKBAR ===== */
    .snackbar {
      position: fixed;
      bottom: calc(var(--nav-h) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: #323232;
      color: white;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 1000;
      transition: transform 0.3s;
      white-space: nowrap;
      pointer-events: none;
    }
    .snackbar.show { transform: translateX(-50%) translateY(0); }

    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>

<!-- HOME PAGE -->
<div id="page-home" class="page active">
  <div class="app-bar"><h1>筋トレ記録</h1></div>

  <div class="card">
    <div class="card-title">今週のトレーニング</div>
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-value" id="stat-sessions">0</span>
        <span class="stat-label">回数</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="stat-sets">0</span>
        <span class="stat-label">合計セット</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="stat-streak">0</span>
        <span class="stat-label">連続記録 🔥</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="cal-header">
      <button class="cal-nav" onclick="calNav(-1)">‹</button>
      <h3 id="cal-month-label"></h3>
      <button class="cal-nav" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-grid">
      <div class="cal-weekday">日</div><div class="cal-weekday">月</div>
      <div class="cal-weekday">火</div><div class="cal-weekday">水</div>
      <div class="cal-weekday">木</div><div class="cal-weekday">金</div>
      <div class="cal-weekday">土</div>
    </div>
    <div class="cal-grid" id="cal-days"></div>
  </div>

  <div class="section-header">最近のトレーニング</div>
  <div id="home-sessions"></div>
  <div style="height:80px;"></div>
</div>

<!-- HISTORY PAGE -->
<div id="page-history" class="page">
  <div class="tab-bar">
    <div class="tab-item active" id="tab-0" onclick="switchTab(0)">トレーニング履歴</div>
    <div class="tab-item" id="tab-1" onclick="switchTab(1)">種目の進捗</div>
  </div>
  <div id="tab-content-0" class="tab-content active">
    <div id="history-list" style="padding:16px 0;"></div>
  </div>
  <div id="tab-content-1" class="tab-content">
    <div class="progress-header">
      <select id="progress-select" onchange="renderProgress()">
        <option value="">種目を選択してください</option>
      </select>
    </div>
    <div id="progress-stats-grid" class="progress-stats-grid" style="display:none;"></div>
    <div id="chart-wrap" class="chart-wrap" style="display:none;">
      <div class="card-title">最高重量の推移</div>
      <canvas id="progress-chart" height="200"></canvas>
    </div>
    <div id="records-list" class="records-list"></div>
    <div style="height:16px;"></div>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="openWorkoutScreen()">
  <svg viewBox="0 0 24 24" fill="currentColor">
    <path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/>
  </svg>
  トレーニング開始
</button>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <div class="nav-item active" id="nav-home" onclick="switchPage('home')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    ホーム
  </div>
  <div class="nav-item" id="nav-history" onclick="switchPage('history')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
    履歴
  </div>
</nav>

<!-- WORKOUT SCREEN -->
<div id="workout-screen" class="screen">
  <div class="screen-header">
    <button class="back-btn" onclick="closeWorkoutScreen()">
      <svg viewBox="0 0 24 24" fill="currentColor" style="width:24px;height:24px;">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
    </button>
    <h2 id="workout-screen-title">トレーニング記録</h2>
    <button class="btn btn-primary" onclick="saveWorkout()" style="padding:8px 16px;font-size:13px;">保存</button>
  </div>
  <div class="screen-body">
    <div class="form-group">
      <label class="form-label">トレーニング名</label>
      <input type="text" id="workout-title" placeholder="例: 胸・三頭筋の日" autocomplete="off">
      <div class="duration-row">
        <label class="form-label" style="margin:0;white-space:nowrap;">時間:</label>
        <input type="number" id="workout-duration" placeholder="60" min="1" max="600" style="width:90px;" inputmode="numeric">
        <span>分</span>
      </div>
    </div>
    <div id="exercise-list"></div>
    <button class="btn btn-outlined btn-block" onclick="openSheet()">
      <svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      種目を追加
    </button>
    <div style="height:16px;"></div>
  </div>
</div>

<!-- EXERCISE SHEET -->
<div id="sheet-overlay" class="overlay" onclick="sheetOverlayClick(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">種目を選択</div>
    <input type="text" class="sheet-search" id="sheet-search" placeholder="種目名・部位で検索..." oninput="filterSheet()" autocomplete="off">
    <div id="sheet-options"></div>
  </div>
</div>

<div id="snackbar" class="snackbar"></div>

<script>
const STORAGE_KEY = 'workout_sessions_v1';

const EXERCISE_DB = [
  { name: 'ベンチプレス', category: '胸' },
  { name: 'インクラインベンチプレス', category: '胸' },
  { name: 'ダンベルフライ', category: '胸' },
  { name: 'ダンベルプレス', category: '胸' },
  { name: 'ペックデック', category: '胸' },
  { name: 'ディップス', category: '胸' },
  { name: 'デッドリフト', category: '背中' },
  { name: 'ラットプルダウン', category: '背中' },
  { name: 'ベントオーバーロー', category: '背中' },
  { name: 'シーテッドロー', category: '背中' },
  { name: 'チンニング（懸垂）', category: '背中' },
  { name: 'ワンハンドロー', category: '背中' },
  { name: 'スクワット', category: '脚' },
  { name: 'レッグプレス', category: '脚' },
  { name: 'レッグカール', category: '脚' },
  { name: 'レッグエクステンション', category: '脚' },
  { name: 'ルーマニアンデッドリフト', category: '脚' },
  { name: 'カーフレイズ', category: '脚' },
  { name: 'ショルダープレス', category: '肩' },
  { name: 'サイドレイズ', category: '肩' },
  { name: 'フロントレイズ', category: '肩' },
  { name: 'フェイスプル', category: '肩' },
  { name: 'アーノルドプレス', category: '肩' },
  { name: 'バーベルカール', category: '腕' },
  { name: 'ダンベルカール', category: '腕' },
  { name: 'ハンマーカール', category: '腕' },
  { name: 'トライセプスプレスダウン', category: '腕' },
  { name: 'スカルクラッシャー', category: '腕' },
  { name: 'オーバーヘッドエクステンション', category: '腕' },
  { name: 'クランチ', category: '腹' },
  { name: 'プランク', category: '腹' },
  { name: 'レッグレイズ', category: '腹' },
  { name: 'ケーブルクランチ', category: '腹' },
  { name: 'アブローラー', category: '腹' },
];

let sessions = [];
let calYear  = new Date().getFullYear();
let calMonth = new Date().getMonth();
let selectedDate = new Date();
let workoutExercises = [];
let progressChart = null;

function loadData() {
  try { sessions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { sessions = []; }
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); }

function switchPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('nav-' + page).classList.add('active');
  document.getElementById('fab').style.display = page === 'home' ? 'flex' : 'none';
  if (page === 'history') { renderHistory(); populateProgressSelect(); }
}

function switchTab(idx) {
  [0, 1].forEach(i => {
    document.getElementById('tab-' + i).classList.toggle('active', i === idx);
    document.getElementById('tab-content-' + i).classList.toggle('active', i === idx);
  });
  if (idx === 1) renderProgress();
}

function calNav(dir) {
  calMonth += dir;
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0;  calYear++; }
  renderCalendar();
}

function renderCalendar() {
  const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('cal-month-label').textContent = `${calYear}年 ${MONTHS[calMonth]}`;
  const firstDow = new Date(calYear, calMonth, 1).getDay();
  const daysInMo = new Date(calYear, calMonth + 1, 0).getDate();
  const today    = new Date();
  const workoutDayKeys = new Set(sessions.map(s => dayKey(new Date(s.date))));
  const container = document.getElementById('cal-days');
  container.innerHTML = '';
  for (let i = 0; i < firstDow; i++) {
    const el = document.createElement('div'); el.className = 'cal-day empty'; container.appendChild(el);
  }
  for (let d = 1; d <= daysInMo; d++) {
    const el = document.createElement('div'); el.className = 'cal-day'; el.textContent = d;
    const isToday    = calYear === today.getFullYear() && calMonth === today.getMonth() && d === today.getDate();
    const isSelected = calYear === selectedDate.getFullYear() && calMonth === selectedDate.getMonth() && d === selectedDate.getDate();
    const key = `${calYear}-${calMonth}-${d}`;
    if (isSelected) el.classList.add('selected');
    else if (isToday) el.classList.add('today');
    if (workoutDayKeys.has(key)) el.classList.add('has-workout');
    el.addEventListener('click', () => { selectedDate = new Date(calYear, calMonth, d); renderCalendar(); });
    container.appendChild(el);
  }
}

function dayKey(date) { return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`; }

function renderStats() {
  const now = new Date();
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay()); weekStart.setHours(0,0,0,0);
  const weekSessions = sessions.filter(s => new Date(s.date) >= weekStart);
  const totalSets = weekSessions.reduce((sum, s) => sum + s.exercises.reduce((es, e) => es + e.sets.length, 0), 0);
  let streak = 0;
  const todayMs = (() => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); })();
  const workoutMsSet = new Set(sessions.map(s => { const d = new Date(s.date); d.setHours(0,0,0,0); return d.getTime(); }));
  let check = todayMs;
  while (workoutMsSet.has(check)) { streak++; check -= 86400000; }
  document.getElementById('stat-sessions').textContent = weekSessions.length;
  document.getElementById('stat-sets').textContent     = totalSets;
  document.getElementById('stat-streak').textContent   = streak;
}

function renderHomeSessions() {
  const container = document.getElementById('home-sessions');
  const recent = [...sessions].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
  if (recent.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg>
      <p>まだトレーニングがありません。<br>「トレーニング開始」ボタンで始めましょう！</p>
    </div>`;
    return;
  }
  container.innerHTML = recent.map(s => sessionCardHTML(s, 'home')).join('');
}

function sessionCardHTML(s, prefix) {
  const date = new Date(s.date);
  const totalSets = s.exercises.reduce((sum, e) => sum + e.sets.length, 0);
  return `<div class="session-card">
    <div class="session-header" onclick="toggleBody('${prefix}-${s.id}')">
      <div class="session-avatar">${esc(s.durationMinutes)}m</div>
      <div class="session-info">
        <div class="session-title">${esc(s.title || '無題')}</div>
        <div class="session-meta">${fmtDate(date)} &nbsp; ${totalSets}セット</div>
      </div>
      <button class="delete-btn" onclick="deleteSession(event,'${s.id}')">🗑</button>
    </div>
    <div class="session-body" id="${prefix}-${s.id}">
      ${s.exercises.map(e => `
        <div class="ex-row">
          <div class="ex-name">${esc(e.name)}</div>
          ${e.sets.map((set,i) => `<div class="set-text">Set ${i+1}: ${set.weight}kg × ${set.reps}回</div>`).join('')}
        </div><hr style="border-color:var(--surface3);margin:6px 0;">
      `).join('')}
    </div>
  </div>`;
}

function toggleBody(id) { const el = document.getElementById(id); if (el) el.classList.toggle('open'); }

function deleteSession(event, id) {
  event.stopPropagation();
  sessions = sessions.filter(s => s.id !== id);
  saveData(); renderHome();
  if (document.getElementById('page-history').classList.contains('active')) { renderHistory(); populateProgressSelect(); }
  showSnack('削除しました');
}

function openWorkoutScreen() {
  workoutExercises = [];
  document.getElementById('workout-title').value = '';
  document.getElementById('workout-duration').value = '';
  const DAYS = ['日','月','火','水','木','金','土'];
  const d = selectedDate;
  document.getElementById('workout-screen-title').textContent = `${d.getMonth()+1}月${d.getDate()}日(${DAYS[d.getDay()]})`;
  renderExerciseList();
  document.getElementById('workout-screen').classList.add('open');
}

function closeWorkoutScreen() { document.getElementById('workout-screen').classList.remove('open'); }

function renderExerciseList() {
  const container = document.getElementById('exercise-list');
  if (workoutExercises.length === 0) {
    container.innerHTML = `<div class="empty-state" style="padding:40px 0 20px;">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/></svg>
      <p>下の「種目を追加」から追加してください</p>
    </div>`;
    return;
  }
  container.innerHTML = workoutExercises.map((ex, exI) => `
    <div class="exercise-card">
      <div class="exercise-card-top">
        <div class="exercise-card-name">${esc(ex.name)}</div>
        <button class="btn btn-danger-text" onclick="removeExercise(${exI})">削除</button>
      </div>
      <div class="sets-table-head"><div>SET</div><div>重量(kg)</div><div>回数</div><div></div></div>
      ${ex.sets.map((set, setI) => `
        <div class="set-row-input">
          <div class="set-num">${setI + 1}</div>
          <input type="number" value="${set.weight || ''}" placeholder="0" min="0" step="0.5" inputmode="decimal"
            onchange="updateSet(${exI},${setI},'weight',this.value)">
          <input type="number" value="${set.reps || ''}" placeholder="0" min="0" inputmode="numeric"
            onchange="updateSet(${exI},${setI},'reps',this.value)">
          <button class="rm-set-btn" onclick="removeSet(${exI},${setI})">×</button>
        </div>
      `).join('')}
      <button class="btn btn-text" onclick="addSet(${exI})" style="font-size:13px;margin-top:2px;">+ セット追加</button>
    </div>
  `).join('');
}

function removeExercise(exI) { workoutExercises.splice(exI, 1); renderExerciseList(); }
function addSet(exI) {
  const prev = workoutExercises[exI].sets.slice(-1)[0] || { weight: 0, reps: 10 };
  workoutExercises[exI].sets.push({ weight: prev.weight, reps: prev.reps });
  renderExerciseList();
}
function removeSet(exI, setI) {
  workoutExercises[exI].sets.splice(setI, 1);
  if (workoutExercises[exI].sets.length === 0) workoutExercises.splice(exI, 1);
  renderExerciseList();
}
function updateSet(exI, setI, field, val) { workoutExercises[exI].sets[setI][field] = parseFloat(val) || 0; }

function saveWorkout() {
  if (workoutExercises.length === 0) { showSnack('種目を追加してください'); return; }
  const title = document.getElementById('workout-title').value.trim() || '筋トレ';
  const duration = parseInt(document.getElementById('workout-duration').value) || 60;
  sessions.push({
    id: Date.now().toString(), title, date: selectedDate.toISOString(), durationMinutes: duration,
    exercises: workoutExercises.map(ex => ({ name: ex.name, category: ex.category, sets: ex.sets.map(s => ({ weight: s.weight, reps: s.reps })) }))
  });
  saveData(); closeWorkoutScreen(); renderHome(); showSnack('保存しました！');
}

function openSheet() {
  document.getElementById('sheet-search').value = '';
  renderSheetOptions(EXERCISE_DB);
  document.getElementById('sheet-overlay').classList.add('open');
}
function closeSheet() { document.getElementById('sheet-overlay').classList.remove('open'); }
function sheetOverlayClick(e) { if (e.target === document.getElementById('sheet-overlay')) closeSheet(); }
function filterSheet() {
  const q = document.getElementById('sheet-search').value.toLowerCase();
  renderSheetOptions(EXERCISE_DB.filter(e => e.name.includes(q) || e.category.includes(q)));
}
function renderSheetOptions(list) {
  const categories = [...new Set(list.map(e => e.category))];
  const container  = document.getElementById('sheet-options');
  if (list.length === 0) { container.innerHTML = '<div class="empty-state" style="padding:24px 0;"><p>見つかりませんでした</p></div>'; return; }
  container.innerHTML = categories.map(cat => `
    <div class="sheet-category">${esc(cat)}</div>
    ${list.filter(e => e.category === cat).map(e => `
      <div class="sheet-option" onclick="selectExercise('${escAttr(e.name)}','${escAttr(e.category)}')">${esc(e.name)}</div>
    `).join('')}
  `).join('');
}
function selectExercise(name, category) {
  workoutExercises.push({ id: Date.now().toString(), name, category, sets: [{ weight: 0, reps: 10 }] });
  closeSheet(); renderExerciseList();
}

function renderHistory() {
  const container = document.getElementById('history-list');
  const sorted = [...sessions].sort((a,b) => new Date(b.date) - new Date(a.date));
  if (sorted.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      <p>まだ記録がありません</p>
    </div>`;
    return;
  }
  container.innerHTML = sorted.map(s => sessionCardHTML(s, 'hist')).join('');
}

function populateProgressSelect() {
  const names = [...new Set(sessions.flatMap(s => s.exercises.map(e => e.name)))].sort();
  const sel = document.getElementById('progress-select');
  const prev = sel.value;
  sel.innerHTML = '<option value="">種目を選択してください</option>' + names.map(n => `<option value="${escAttr(n)}"${n===prev?' selected':''}>${esc(n)}</option>`).join('');
}

function renderProgress() {
  const name = document.getElementById('progress-select').value;
  const statsGrid = document.getElementById('progress-stats-grid');
  const chartWrap = document.getElementById('chart-wrap');
  const recordsList = document.getElementById('records-list');
  if (!name) { statsGrid.style.display='none'; chartWrap.style.display='none'; recordsList.innerHTML=''; return; }
  const points = sessions.filter(s => s.exercises.some(e => e.name === name))
    .sort((a,b) => new Date(a.date) - new Date(b.date))
    .map(s => { const ex = s.exercises.find(e => e.name === name); return { date: new Date(s.date), weight: Math.max(...ex.sets.map(set => set.weight)) }; });
  if (points.length === 0) { statsGrid.style.display='none'; chartWrap.style.display='none'; recordsList.innerHTML='<div class="empty-state"><p>データがありません</p></div>'; return; }
  const maxW = Math.max(...points.map(p => p.weight));
  const diff = points.length >= 2 ? (points.at(-1).weight - points[0].weight) : 0;
  statsGrid.style.display = 'grid';
  statsGrid.innerHTML = `
    <div class="progress-stat"><span class="progress-stat-icon">🏆</span><div><div class="progress-stat-label">最高重量</div><div class="progress-stat-val">${maxW} kg</div></div></div>
    <div class="progress-stat"><span class="progress-stat-icon">📈</span><div><div class="progress-stat-label">期間の伸び</div><div class="progress-stat-val">${diff>=0?'+':''}${diff} kg</div></div></div>`;
  chartWrap.style.display = 'block';
  if (progressChart) { progressChart.destroy(); progressChart = null; }
  const ctx = document.getElementById('progress-chart').getContext('2d');
  progressChart = new Chart(ctx, {
    type: 'line',
    data: { labels: points.map(p => fmtDateShort(p.date)), datasets: [{ data: points.map(p => p.weight), borderColor: '#1E88E5', backgroundColor: 'rgba(30,136,229,0.12)', borderWidth: 2.5, pointBackgroundColor: '#1E88E5', pointRadius: 5, fill: true, tension: 0.35 }] },
    options: { responsive: true, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${ctx.parsed.y} kg` } } }, scales: { x: { ticks: { color: '#9E9E9E', font: { size: 11 } }, grid: { color: '#2A2A2A' } }, y: { ticks: { color: '#9E9E9E', font: { size: 11 }, callback: v => v + ' kg' }, grid: { color: '#2A2A2A' } } } }
  });
  recordsList.innerHTML = `
    <div style="font-size:14px;font-weight:600;margin-bottom:8px;">記録一覧</div>
    ${[...points].reverse().map(p => `<div class="record-row"><span>${fmtDate(p.date)}</span><span class="record-weight">${p.weight} kg</span></div>`).join('')}
    <div style="height:16px;"></div>`;
}

function fmtDate(date) {
  const DAYS = ['日','月','火','水','木','金','土'];
  return `${date.getMonth()+1}月${date.getDate()}日(${DAYS[date.getDay()]})`;
}
function fmtDateShort(date) { return `${date.getMonth()+1}/${date.getDate()}`; }
function esc(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(str) { return String(str).replace(/'/g,"&#39;").replace(/"/g,'&quot;'); }
function showSnack(msg) {
  const sb = document.getElementById('snackbar');
  sb.textContent = msg; sb.classList.add('show');
  setTimeout(() => sb.classList.remove('show'), 2600);
}

function renderHome() { renderStats(); renderCalendar(); renderHomeSessions(); }

loadData();
renderHome();

// Service Worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/workout-ios/sw.js').catch(() => {});
}
</script>
</body>
</html>
